<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mega Clicker & Sahura Ad-Farm</title>
  <style>
    body {
      background-color: #0d0d13;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      margin: 0;
      padding: 15px;
    }

    /* Główny kontener - Układ 2 kolumn obok siebie */
    .top-layout {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto 20px auto;
    }

    .card {
      background: linear-gradient(145deg, #1e1e2f, #2a2a40);
      border-radius: 20px;
      padding: 20px;
      flex: 1 1 400px;
      max-width: 460px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 2px solid #ff0055;
      box-sizing: border-box;
    }

    .score-display {
      font-size: 30px;
      font-weight: bold;
      color: #00ffcc;
      margin: 10px 0;
      text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
    }

    .cps-display {
      font-size: 15px;
      color: #ffcc00;
      margin-bottom: 15px;
    }

    .main-btn {
      font-size: 55px;
      padding: 15px 35px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(145deg, #ff0055, #ff5500);
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(255, 0, 85, 0.4);
      transition: transform 0.05s ease;
      user-select: none;
    }

    .main-btn:active {
      transform: scale(0.90);
    }

    .upgrade-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .upg-btn {
      background: #282a36;
      color: #fff;
      border: 1px solid #44475a;
      padding: 10px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .upg-btn:active {
      transform: translateY(1px);
    }

    /* Farma Reklam obok Sahura */
    .ad-farm-box {
      margin-top: 15px;
      background: #11111d;
      padding: 15px;
      border-radius: 12px;
      border: 1px dashed #ffcc00;
    }

    .farm-btn {
      background: linear-gradient(145deg, #00ffcc, #0099ff);
      color: #000;
      font-weight: bold;
      font-size: 16px;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
      width: 100%;
      margin-top: 8px;
    }

    .farm-btn:active {
      transform: scale(0.95);
    }

    video {
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.8);
      border: 2px solid #00ffcc;
      width: 100%;
      max-width: 300px;
      height: auto;
    }

    /* Sekcja "Fala Reklam" pod spodem */
    .ad-wave-section {
      max-width: 1000px;
      margin: 30px auto;
      padding: 15px;
      background: #151522;
      border-radius: 15px;
      border: 1px solid #333;
    }

    .ad-wave-title {
      color: #ff0055;
      font-size: 20px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <!-- KONTENER GŁÓWNY: CLICKER OBOK SAHURA -->
  <div class="top-layout">
    
    <!-- LEWA KOLUMNA: GRA CLICKER -->
    <div class="card">
      <h2>🚀 HYPER CLICKER 💎</h2>
      <div class="score-display" id="score">0 🍪</div>
      <div class="cps-display" id="cps">Moc: +1 | Auto: 0/s</div>

      <button class="main-btn" id="clickBtn">🔥</button>

      <div style="font-size: 16px; margin-top: 15px; color: #ff0055;">⚡ UPGRADE'Y ⚡</div>
      
      <div class="upgrade-grid">
        <button class="upg-btn" onclick="buyUpgrade('click', 10, 1)">
          <span>⚡ Lepsze Kliknięcie</span>
          <strong id="cost-click">Koszt: 10</strong>
        </button>

        <button class="upg-btn" onclick="buyUpgrade('auto', 25, 1)">
          <span>🤖 Auto-Bot</span>
          <strong id="cost-auto">Koszt: 25</strong>
        </button>

        <button class="upg-btn" onclick="buyUpgrade('multiplier', 100, 2)">
          <span>💥 Mnożnik X2</span>
          <strong id="cost-multiplier">Koszt: 100</strong>
        </button>

        <button class="upg-btn" onclick="buyUpgrade('frenzy', 250, 5)">
          <span>🎉 Ultra Impreza</span>
          <strong id="cost-frenzy">Koszt: 250</strong>
        </button>
      </div>
    </div>

    <!-- PRAWA KOLUMNA: SAHURA + FARMA REKLAM -->
    <div class="card">
      <h2>🎬 Sahura Zone</h2>
      <video controls autoplay loop muted playsinline>
        <source src="sahura.mp4" type="video/mp4">
        Twoja przeglądarka nie obsługuje odtwarzacza wideo.
      </video>

      <!-- FARMA REKLAM OBOK SAHURA -->
      <div class="ad-farm-box">
        <div style="color: #ffcc00; font-size: 14px; font-weight: bold;">💰 FARMA KLIKNIĘĆ 💰</div>
        <p style="font-size: 12px; color: #aaa; margin: 5px 0;">Kliknij przycisk, aby zdobyć darmowe bonusy w grze i otworzyć sponsorowane oferty!</p>
        <button class="farm-btn" onclick="triggerAdFarm()">🎁 ODBIERZ BONUS (AD)</button>
      </div>
    </div>

  </div>

  <!-- LOGIKA GRY I FARMY REKLAM -->
  <script>
    let score = 0;
    let clickPower = 1;
    let autoPower = 0;

    let costs = { click: 10, auto: 25, multiplier: 100, frenzy: 250 };

    const scoreEl = document.getElementById('score');
    const cpsEl = document.getElementById('cps');
    const clickBtn = document.getElementById('clickBtn');
    const icons = ['🔥', '💎', '🚀', '👑', '🍕', '👾', '🌟', '⚡'];

    clickBtn.addEventListener('click', () => {
      score += clickPower;
      updateDisplay();
      if (Math.random() < 0.2) {
        clickBtn.innerText = icons[Math.floor(Math.random() * icons.length)];
      }
    });

    function buyUpgrade(type, baseCost, power) {
      if (score >= costs[type]) {
        score -= costs[type];
        if (type === 'click') clickPower += power;
        else if (type === 'auto') autoPower += power;
        else if (type === 'multiplier') clickPower *= power;
        else if (type === 'frenzy') autoPower += power;

        costs[type] = Math.floor(costs[type] * 1.5);
        document.getElementById(`cost-${type}`).innerText = `Koszt: ${costs[type]}`;
        updateDisplay();
      }
    }

    function updateDisplay() {
      scoreEl.innerText = `${Math.floor(score)} 🍪`;
      cpsEl.innerText = `Moc: +${clickPower} | Auto: ${autoPower}/s`;
    }

    // Farma reklam - dodaje punkty w grze i wymusza interakcję
    function triggerAdFarm() {
      score += 500; // Nagroda w grze za kliknięcie
      updateDisplay();
      // Otwarcie domyślnego linku reklamowego w nowej karcie
      window.open('https://afders.org/1/ebd730f3c6eca304cdf886d0c3fa9334', '_blank');
    }

    setInterval(() => {
      if (autoPower > 0) {
        score += autoPower;
        updateDisplay();
      }
    }, 1000);
  </script>

  <!-- FALA REKLAM POD KLIKEREM I SAHURĄ -->
  <div class="ad-wave-section">
    <div class="ad-wave-title">🌊 STREFA SPONSOROWANA (FALA REKLAM) 🌊</div>

    <!-- Skrypty Reklamowe Adsterra (Popunder, Social Bar, Native) -->

    <script data-cfasync="false" src="https://bicea.org/14/f1fbfd28972913e71da21cf82cefc71d"></script>
    <script data-cfasync="false" src="https://arwf.org/4/f97f20828b7d401da777095616d9c2c2"></script>
    
    <!-- Pojemnik drugiego formatu -->
    <div id="container-3da3a590821a73aff858b93a95d3ea67"></div>
    <script async="async" data-cfasync="false" src="https://bicea.org/21/3da3a590821a73aff858b93a95d3ea67"></script>

    <!-- Baner 300x250 -->
    <div style="margin-top: 15px;">

        atOptions = {
          'key' : 'ce7c38d1fee594409438d0d5d9058f9a',

          'params' : {}
        };
      </script>
      <script type="text/javascript" src="https://bicea.org/22/ce7c38d1fee594409438d0d5d9058f9a"></script>
    </div>
  </div>

</body>
</html>
