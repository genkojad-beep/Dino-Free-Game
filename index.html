<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mega Clicker & Sahura Zone</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      margin: 0;
      padding: 15px;
    }

    .clicker-card {
      background: linear-gradient(145deg, #1e1e2f, #2a2a40);
      border-radius: 20px;
      padding: 20px;
      max-width: 450px;
      margin: 0 auto 20px auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 2px solid #ff0055;
    }

    .score-display {
      font-size: 32px;
      font-weight: bold;
      color: #00ffcc;
      margin: 10px 0;
      text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
    }

    .cps-display {
      font-size: 16px;
      color: #ffcc00;
      margin-bottom: 15px;
    }

    .main-btn {
      font-size: 60px;
      padding: 20px 40px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(145deg, #ff0055, #ff5500);
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(2ff, 0, 85, 0.4);
      transition: transform 0.05s ease, box-shadow 0.05s ease;
      user-select: none;
    }

    .main-btn:active {
      transform: scale(0.92);
      box-shadow: 0 4px 10px rgba(255, 0, 85, 0.8);
    }

    .shop-title {
      font-size: 20px;
      margin: 20px 0 10px 0;
      color: #ff0055;
      text-shadow: 0 0 5px rgba(255, 0, 85, 0.5);
    }

    .upgrade-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .upg-btn {
      background: #282a36;
      color: #fff;
      border: 1px solid #44475a;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .upg-btn:hover {
      background: #383a59;
      transform: translateY(-2px);
    }

    .upg-btn:active {
      transform: translateY(0);
    }

    .upg-btn span {
      font-size: 18px;
    }

    .sahura-section {
      margin-top: 30px;
    }

    .sahura-section h2 {
      color: #00ffcc;
      font-size: 22px;
      margin-bottom: 10px;
    }

    video {
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.8);
      border: 2px solid #00ffcc;
    }
  </style>
</head>
<body>

  <!-- GRA CLICKER -->
  <div class="clicker-card">
    <h1>🚀 HYPER CLICKER 💎</h1>
    <div class="score-display" id="score">0 🍪</div>
    <div class="cps-display" id="cps">Moc kliknięcia: +1 | Automatycznie: 0/s</div>

    <!-- Główny Przycisk -->
    <button class="main-btn" id="clickBtn">🔥</button>

    <div class="shop-title">⚡ SKLEP & UPGRADE'Y ⚡</div>
    
    <div class="upgrade-grid">
      <button class="upg-btn" onclick="buyUpgrade('click', 10, 1, '⚡')">
        <span>⚡ Lepsze Kliknięcie</span>
        <span>+1 / klik</span>
        <strong id="cost-click">Koszt: 10</strong>
      </button>

      <button class="upg-btn" onclick="buyUpgrade('auto', 25, 1, '🤖')">
        <span>🤖 Auto-Bot</span>
        <span>+1 / sek</span>
        <strong id="cost-auto">Koszt: 25</strong>
      </button>

      <button class="upg-btn" onclick="buyUpgrade('multiplier', 100, 2, '💥')">
        <span>💥 Mnożnik X2</span>
        <span>Podwój moc</span>
        <strong id="cost-multiplier">Koszt: 100</strong>
      </button>

      <button class="upg-btn" onclick="buyUpgrade('frenzy', 250, 5, '🎉')">
        <span>🎉 Ultra Impreza</span>
        <span>+5 / sek</span>
        <strong id="cost-frenzy">Koszt: 250</strong>
      </button>
    </div>
  </div>

  <!-- LOGIKA GRY -->
  <script>
    let score = 0;
    let clickPower = 1;
    let autoPower = 0;

    let costs = {
      click: 10,
      auto: 25,
      multiplier: 100,
      frenzy: 250
    };

    const scoreEl = document.getElementById('score');
    const cpsEl = document.getElementById('cps');
    const clickBtn = document.getElementById('clickBtn');

    const icons = ['🔥', '💎', '🚀', '👑', '🍕', '👾', '🌟', '⚡'];

    clickBtn.addEventListener('click', () => {
      score += clickPower;
      updateDisplay();
      // Losowa zmiana emotki na przycisku dla uatrakcyjnienia
      if (Math.random() < 0.2) {
        clickBtn.innerText = icons[Math.floor(Math.random() * icons.length)];
      }
    });

    function buyUpgrade(type, baseCost, power, icon) {
      if (score >= costs[type]) {
        score -= costs[type];
        
        if (type === 'click') {
          clickPower += power;
        } else if (type === 'auto') {
          autoPower += power;
        } else if (type === 'multiplier') {
          clickPower *= power;
        } else if (type === 'frenzy') {
          autoPower += power;
        }

        costs[type] = Math.floor(costs[type] * 1.5);
        document.getElementById(`cost-${type}`).innerText = `Koszt: ${costs[type]}`;
        updateDisplay();
      }
    }

    function updateDisplay() {
      scoreEl.innerText = `${Math.floor(score)} 🍪`;
      cpsEl.innerText = `Moc kliknięcia: +${clickPower} | Automatycznie: ${autoPower}/s`;
    }

    // Automatyczny przyrost punktów co sekundę
    setInterval(() => {
      if (autoPower > 0) {
        score += autoPower;
        updateDisplay();
      }
    }, 1000);
  </script>

  <!-- Sekcja Wideo Sahura (Odtwarzanie w pętli bez końca) -->
  <div class="sahura-section">
    <h2>Strefa Wideo: Sahura 🎬</h2>
    <video width="320" height="560" controls autoplay loop muted playsinline>
      <source src="sahura.mp4" type="video/mp4">
      Twoja przeglądarka nie obsługuje odtwarzacza wideo.
    </video>
  </div>
